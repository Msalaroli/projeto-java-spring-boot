version: '3.9'

services:
  postgres:
    container_name: projeto-java-postgres
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=DB-postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

volumes:
  pgdata:
    driver: local